# HADES Training Service Configuration
# Install to /etc/hades/trainer.conf
# Sourced by the systemd unit via EnvironmentFile=

# GPU device for training.
#
# There is deliberately NO fallback device. GNN training is infrequent, and an
# infrequently exercised default is a forgotten default. Every run declares its
# device at the CLI (hades --gpu N graph-embed train). The server rejects
# InitModel/LoadCheckpoint requests that carry no device. Device strings map
# directly to physical GPUs (CUDA_VISIBLE_DEVICES is intentionally NOT set).

# Socket path (must match the client's TrainingClientConfig default).
HADES_TRAINER_SOCKET=/run/hades/training.sock

# PyTorch memory management
PYTORCH_ALLOC_CONF=expandable_segments:True
