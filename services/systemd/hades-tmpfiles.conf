# /etc/tmpfiles.d/hades.conf
#
# SOLE owner of /run/hades/. The hades units deliberately declare no
# RuntimeDirectory=: they shared RuntimeDirectory=hades, and systemd removes a
# unit's RuntimeDirectory on stop — so any one service stopping unlinked the
# OTHER services' live sockets (observed 2026-07-20). This file creates the
# directory at boot and unit lifecycle never tears it down. Sockets inside it
# are created by the services themselves, born group-connectable via each
# unit's UMask=0007.
#
# Apply: sudo systemd-tmpfiles --create /etc/tmpfiles.d/hades.conf

#Type Path        Mode UID    GID    Age Argument
d     /run/hades  0755 hades  hades  -   -
