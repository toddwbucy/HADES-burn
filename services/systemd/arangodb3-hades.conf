# arangod drop-in required by HADES.
#
# Install to /etc/systemd/system/arangodb3.service.d/hades.conf
# (hades-install.sh does this, or: sudo install -D -m 644
#  services/systemd/arangodb3-hades.conf \
#  /etc/systemd/system/arangodb3.service.d/hades.conf)
#
# WHY THIS EXISTS
#
# HADES talks to ArangoDB over the Unix socket at
# /run/arangodb3/arangodb.sock, not over TCP. That is the load-bearing
# latency decision for the query hot path. The stock arangodb3 package
# does not leave that socket group-connectable, and its unit type
# expects a PID file that the socket-endpoint configuration does not
# produce. Without this drop-in a fresh install comes up "running" but
# every HADES command fails to connect.
#
# HISTORY
#
# This consolidates three hand-written drop-ins that accumulated on the
# original workstation and were never tracked in git (override.conf,
# pidfile-fix.conf, socket-permissions.conf). pidfile-fix.conf set
# Type= twice, to notify and then to simple, so systemd used the last
# value. Only the effective values are kept here. If those three files
# are present from an older install, remove them: they are superseded.

[Service]
# Type/PIDFile: the packaged unit waits for a PID file that does not
# appear in this configuration. Run as a plain foreground process
# instead.
Type=simple
PIDFile=

# A stale socket file from an unclean shutdown makes the bind fail.
ExecStartPre=/usr/bin/env rm -f /run/arangodb3/arangodb.sock

# Make the socket connectable by members of the `arangodb` group. The
# `hades` service user is a member (see hades-sysusers.conf), which is
# how the daemon, the CLI, and interactive operators reach the database
# without being root. arangod does not expose a mode setting for the
# socket, so it is chmod'ed after bind. The loop tolerates up to 10s of
# startup delay before giving up.
ExecStartPost=/bin/bash -c 'for i in {1..100}; do [ -e /run/arangodb3/arangodb.sock ] && break; sleep 0.1; done; if [ -e /run/arangodb3/arangodb.sock ]; then chmod 770 /run/arangodb3/arangodb.sock; fi'
