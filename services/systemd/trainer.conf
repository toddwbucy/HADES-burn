# HADES Training Service Configuration
# Install to /etc/hades/trainer.conf
# Sourced by the systemd unit via EnvironmentFile=

# GPU device for training.
#
# Selection is normally driven by the *client* per run: the orchestrator sends
# the device from `hades.yaml` `gpu.device` (or the `--gpu` flag) in the
# InitModel request, and the server honors it. HADES_TRAINER_DEVICE below is the
# fallback used only when the client sends no device. Default cuda:2 = the
# embedder's GPU (RTX 2000 Ada).
#
# To run on a different GPU, set `gpu.device` in hades.yaml (e.g. cuda:0) — it
# flows through to the trainer. Device strings here map directly to physical
# GPUs (CUDA_VISIBLE_DEVICES is intentionally NOT set, so the client's `cuda:2`
# and a server fallback of `cuda:2` agree on the same physical device).
HADES_TRAINER_DEVICE=cuda:2

# Socket path (must match the client's TrainingClientConfig default).
HADES_TRAINER_SOCKET=/run/hades/training.sock

# PyTorch memory management
PYTORCH_ALLOC_CONF=expandable_segments:True
