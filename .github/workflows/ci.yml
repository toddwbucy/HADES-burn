name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs of the same workflow on the same ref when a new
# commit lands. Avoids burning CI minutes on stale PR pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: build / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --verbose

      # Unit tests only. Integration tests that require a running ArangoDB
      # or embedder service (e.g. tests/graph_loader.rs) are out of scope
      # until issue #93 (workstation-specific test isolation spec) lands.
      - name: cargo test --lib
        run: cargo test --workspace --lib --verbose
